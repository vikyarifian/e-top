root = "."
tmp_dir = "tmp"

[build]
    # Akhiran .exe wajib pada Windows: tanpa itu air menghasilkan berkas
    # yang sah sebagai PE32+ tetapi tidak dapat dijalankan sistem, dan
    # muncul dialog "How do you want to open this file" setiap kali.
    #
    # Tanda -tags dev sengaja tidak dipakai. Tag itu mengeluarkan
    # static_prod.go dari kompilasi, sedangkan static_dev.go yang mestinya
    # menggantikannya bertanda build "new", bukan "dev", dan memanggil
    # http.FileServerFs serta os.DirFs yang tidak ada di pustaka standar.
    bin = "tmp\main.exe"
    cmd = "go build -o ./tmp/main.exe ."

    delay = 20
    exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
    exclude_file = []
    exclude_regex = [".*_templ.go"]
    exclude_unchanged = false
    follow_symlink = false
    full_bin = ""
    include_dir = []
    include_ext = ["go", "tpl", "templ", "html"]
    kill_delay = "0s"
    log = "build-errors.log"
    send_interrupt = false
    stop_on_error = true

[color]
    app = ""
    build = "yellow"
    main = "magenta"
    runner = "green"
    watcher = "cyan"

[log]
    time = false

[misc]
    clean_on_exit = false